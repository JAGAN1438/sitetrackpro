name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Create Web Directory & Config
        run: |
          mkdir -p www
          cp site-track-pro.html www/index.html
          cat << 'EOF' > package.json
          {
            "name": "site-track-pro",
            "version": "1.0.0",
            "private": true
          }
          EOF
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.sitetrack.pro",
            "appName": "Site Track Pro",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Install Capacitor & Add Android
        run: |
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5
          npx cap add android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SiteTrackPro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
